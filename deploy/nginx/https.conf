upstream backend_api {
    zone backend_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name musiccam.chilecentral.cloudapp.azure.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name musiccam.chilecentral.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/musiccam.chilecentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musiccam.chilecentral.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend_api;
    }
    location /uploads/ {
        proxy_pass http://backend_api;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
