# Despliegue en la VM de Azure. Estructura esperada en ~/musiccam:
#   compose.yaml  .env  nginx/default.conf  backend/ (repo API)  frontend/ (repo SPA)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: streaming
    volumes:
      - musiccam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d streaming"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET}
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/streaming
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - musiccam_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN}/api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  musiccam_pgdata:
  musiccam_uploads:
